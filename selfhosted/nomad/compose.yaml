name: nomad
services:
  app:
    image: mauriceboe/nomad:latest
    container_name: nomad
    ports:
      - "6790:6790"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-}
      - ALLOWED_ORIGINS=https://nomad.jaumoso.ovh, http://192.168.1.20  # Optional: restrict CORS to specific origins
      - PORT=6790
    volumes:
      - /mnt/externaldisk0/nomad/data:/app/data
      - /mnt/externaldisk0/nomad/uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6790/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s