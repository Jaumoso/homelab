name: dockhand
services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    ports:
      - 3987:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/externaldisk0/dockhand:/app/data
      - /home/jaumoso/selfhosted:/stacks
networks:
  dockhand:
    name: dockhand
