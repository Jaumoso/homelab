services:
  server:
    image: docker.io/awinterstein/habitica-server:latest
    restart: unless-stopped
    container_name: habitica-server
    depends_on:
      - mongo
    environment:
      - NODE_DB_URI=mongodb://mongo/habitica # this only needs to be adapted if using a separate database
      - BASE_URL=https://habitica.jaumoso.ovh # change this to the URL under which your instance will be reachable
      - INVITE_ONLY=false # change to `true` after registration of initial users, to restrict further registrations
      - EMAIL_SERVER_URL=${EMAIL_SERVER_URL}
      - EMAIL_SERVER_PORT=${EMAIL_SERVER_PORT}
      - EMAIL_SERVER_AUTH_USER=${EMAIL_SERVER_AUTH_USER}
      - EMAIL_SERVER_AUTH_PASSWORD=${EMAIL_SERVER_AUTH_PASSWORD}
    ports:
      - 4577:3000
    networks:
      - habitica
  mongo:
    image: docker.io/mongo:latest
    container_name: habitica-mongo
    hostname: mongo
    restart: unless-stopped
    command: ["--replSet", "rs", "--bind_ip_all", "--port", "27017"]
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate() }" | mongosh --port 27017 --quiet
      interval: 10s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    volumes:
      - /mnt/externaldisk0/habitica/mongodb-data/db:/data/db:rw
      - /mnt/externaldisk0/habitica/mongodb-data/dbconf:/data/configdb
    networks:
      habitica:
        aliases:
          - mongo
networks:
  habitica:
    driver: bridge
