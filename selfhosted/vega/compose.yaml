services:
  ollama:
    image: ollama/ollama
    container_name: vega-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  chroma:
    image: chromadb/chroma
    container_name: vega-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma:/chroma
    restart: unless-stopped

  webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: vega-webui
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - VECTOR_DB=chroma
      - CHROMA_HTTP_HOST=chroma
      - CHROMA_HTTP_PORT=8000
    ports:
      - "3000:8080"
    depends_on:
      - ollama
      - chroma
    volumes:
      - webui:/app/backend/data
    restart: unless-stopped

  tts:
    image: ghcr.io/coqui-ai/xtts:latest
    container_name: vega-tts
    ports:
      - "8020:8020"
    volumes:
      - ./voices:/voices
    restart: unless-stopped

  vega-core:
    build: ./vega-core
    container_name: vega-core
    depends_on:
      - ollama
      - chroma
      - tts
    volumes:
      - ./vega-core:/app
      - ./logs:/logs
    restart: unless-stopped

volumes:
  ollama:
  chroma:
  webui:
