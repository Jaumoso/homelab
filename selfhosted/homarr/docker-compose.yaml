services:
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
      - /mnt/externaldisk0/homarr/appdata:/appdata
    environment:
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
      - LOG_LEVEL=warn
      - DOCKER_HOSTNAMES=homarr-socket-proxy
      - DOCKER_PORTS=2375
    ports:
      - 3001:7575
    networks:
      - jellyfin
      - homarr-docker
    depends_on:
      - homarr-socket-proxy

  homarr-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: homarr-socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    environment:
      - CONTAINERS=1
      - INFO=1
      - EVENTS=1
      - PING=1
      - VERSION=1
      - POST=0
      - TZ=Europe/Madrid
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homarr-docker

networks:
  homarr-docker:
    name: homarr-docker
    internal: true
  jellyfin:
    external: true
