services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    user: 1000:1000
    container_name: seerr
    environment:
      - LOG_LEVEL=warn
      - TZ=Europe/Madrid
      - PORT=5055 #optional
    ports:
      - 5055:5055
    volumes:
      - /mnt/externaldisk0/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status
        || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - jellyfin
networks:
  jellyfin:
    external: true
