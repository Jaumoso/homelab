services:
  db_recipes:
    restart: unless-stopped
    image: postgres:16-alpine
    volumes:
      - /mnt/externaldisk0/tandoor/postgresql:/var/lib/postgresql/data
    env_file:
      - ./.env

  web_recipes:
    restart: unless-stopped
    image: vabene1111/recipes
    env_file:
      - ./.env
    ports:
      - 8341:80
    volumes:
      - /mnt/externaldisk0/tandoor/staticfiles:/opt/recipes/staticfiles
      - /mnt/externaldisk0/tandoor/mediafiles:/opt/recipes/mediafiles
    depends_on:
      - db_recipes