name: trek
services:
  app:
    image: mauriceboe/trek:latest
    container_name: trek
    ports:
      - 6790:6790
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-}
      - ALLOWED_ORIGINS=https://trek.jaumoso.ovh, http://192.168.1.20 # Optional: restrict CORS to specific origins
      - PORT=6790
    volumes:
      - /mnt/externaldisk0/trek/data:/app/data
      - /mnt/externaldisk0/trek/uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:6790/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
networks: {}
