services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - 5678:5678
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_RUNNERS_ENABLED=true
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
    volumes:
      - /mnt/externaldisk0/n8n/n8n_data:/home/node/.n8n
      - /home/jaumoso/selfhosted/n8n/local-files:/files
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # 2. SearXNG - Buscador Web (JSON format)
  searxng:
    image: searxng/searxng:latest
    ports:
      - 5968:8080
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: 1MB
        max-file: "1"
  # 3. Qdrant - Memoria Vectorial
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - 6333:6333
    volumes:
      - /mnt/externaldisk0/qdrant:/qdrant/storage
    restart: unless-stopped
networks: {}
