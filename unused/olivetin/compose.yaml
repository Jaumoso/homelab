name: olivetin
services:
  olivetin:
    container_name: olivetin
    image: jamesread/olivetin
    volumes:
      - /home/jaumoso/selfhosted/olivetin:/config # replace host path or volume as needed
    ports:
      - "1337:1337"
    # Necesario para que nsenter pueda entrar en el namespace del host (PID 1)
    # y ejecutar los botones de actualización como root, sin pedir contraseña.
    privileged: true
    pid: host
    user: "0:0"
    restart: unless-stopped
