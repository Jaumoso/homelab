name: foldergram
services:
  foldergram:
    image: ghcr.io/foldergram/foldergram:latest
    ports:
      - "4141:4141"
    environment:
      IMAGE_DETAIL_SOURCE: preview
      DERIVATIVE_MODE: eager
      # Optional: skip specific source folders by name or by exact relative path.
      # GALLERY_EXCLUDED_FOLDERS: "@eaDir,thumbnails,Archive/cache"
      # Optional: enable read-only public demo behavior.
      # PUBLIC_DEMO_MODE: "1"
      # Optional when the browser-visible origin differs from the upstream Node host.
      CSRF_TRUSTED_ORIGINS: https://foldergram.jaumoso.ovh
      NODE_ENV: production
    volumes:
      - /mnt/externaldisk0/foldergram/gallery:/app/data/gallery
      - /mnt/externaldisk0/foldergram/db:/app/data/db
      - /mnt/externaldisk0/foldergram/thumbnails:/app/data/thumbnails
      - /mnt/externaldisk0/foldergram/previews:/app/data/previews
    restart: unless-stopped