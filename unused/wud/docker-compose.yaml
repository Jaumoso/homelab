services:
  wud:
    image: getwud/wud:latest
    container_name: wud
    restart: unless-stopped
    ports:
      - 3333:3000
    environment:
      TZ: Europe/Madrid
      WUD_LOG_LEVEL: warn
      WUD_AUTH_BASIC_JAUMOSO_USER: ${WUD_AUTH_BASIC_JAUMOSO_USER}
      WUD_AUTH_BASIC_JAUMOSO_HASH: ${WUD_AUTH_BASIC_JAUMOSO_HASH}
      # Watcher - Docker local
      WUD_WATCHER_LOCAL_SOCKET: /var/run/docker.sock
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: "true"
      WUD_WATCHER_LOCAL_WATCHATSTART: "false"
      WUD_WATCHER_LOCAL_WATCHALL: "true"
      WUD_WATCHER_LOCAL_CRON: 0/30 * * * *
      WUD_TRIGGER_NTFY_HOMELAB_AUTO: "true"
      WUD_TRIGGER_NTFY_HOMELAB_MODE: batch
      WUD_TRIGGER_NTFY_HOMELAB_URL: http://192.168.1.20:5684/
      WUD_TRIGGER_NTFY_HOMELAB_TOPIC: docker-updates
      WUD_TRIGGER_NTFY_HOMELAB_PRIORITY: 3
      WUD_TRIGGER_NTFY_HOMELAB_AUTH_TOKEN: ${WUD_TRIGGER_NTFY_HOMELAB_AUTH_TOKEN}
      WUD_TRIGGER_NTFY_HOMELAB_ONCE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/store
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:3000/health
networks: {}
