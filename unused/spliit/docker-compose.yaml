name: spliit
services:
  app:
    image: ghcr.io/spliit-app/spliit:latest
    ports:
      - 3958:3000
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - spliit_network

  db:
    image: postgres:latest
    expose:
      - 5432
    env_file:
      - .env
    volumes:
      - /mnt/externaldisk0/spliit/postgresql:/var/lib/postgresql/
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spliit_network

networks:
  spliit_network:
    driver: bridge